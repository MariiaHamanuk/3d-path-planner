# Builds the Doxygen API reference and publishes it with GitHub Pages.
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
# The site is then at https://<owner>.github.io/<repository>/.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: Generate the reference
        run: doxygen Doxyfile
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    # Only the main branch is published; pull requests just check that the docs build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
