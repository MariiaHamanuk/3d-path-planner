# Mouse support
set -g mouse on

# Remove useless text from status bar
set -g status-left ""

# Allow scrollback
set -g history-limit 50000

# Vi-style navigation and selection in copy mode
setw -g mode-keys vi

# Copy to tmux buffer and, where supported, the terminal system clipboard
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Reload this config with CtrlB + r
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Kill the current session with prefix + q
bind q kill-session